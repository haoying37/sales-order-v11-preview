<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>销售开单</title>
  <link rel="stylesheet" href="../assets/design-system/wego-design/colors_and_type.css">
  <link rel="stylesheet" href="../assets/design-system/wego-design/iconfont.css">
  <link rel="stylesheet" href="../assets/design-system/iconfont/iconfont-aliases.css">
  <link rel="stylesheet" href="../assets/design-system/wego-design/components.css">
  <link rel="stylesheet" href="../source/scene.css?v=catalog-hidden-review43">
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--bg-page); }
    body { color: var(--text-default); font-family: var(--body-md-font-family); -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    *, *::before, *::after { box-sizing: border-box; }
    button, input, textarea { font: inherit; }
    button { margin: 0; border: 0; cursor: pointer; }
    .preview-shell, .phone-screen, #scene-root { position: relative; width: 100%; height: 100vh; height: 100dvh; min-height: 0; overflow: hidden; }
  </style>
</head>
<body data-bg="page">
  <div class="preview-shell"><div class="phone-screen"><main id="scene-root" aria-label="销售开单"></main></div></div>
  <div class="toast toast--default is-floating app-toast-host" data-component="toast" data-variant-name="Toast" data-variant-cn="默认提示" data-toast-host role="status" aria-live="polite" aria-atomic="true"><span class="toast__text" data-toast-text></span></div>
  <script>
    (function () {
      var scenes = {};
      var destroyCallbacks = [];
      var historyStack = [];
      var toastTimer = 0;
      var root = document.getElementById('scene-root');
      var toastHost = document.querySelector('[data-toast-host]');
      var toastText = toastHost.querySelector('[data-toast-text]');

      function toast(message) {
        window.clearTimeout(toastTimer);
        toastText.textContent = message;
        toastHost.classList.add('is-visible');
        toastTimer = window.setTimeout(function () { toastHost.classList.remove('is-visible'); }, 4000);
      }
      function destroyScene() { destroyCallbacks.splice(0).forEach(function (callback) { try { callback(); } catch (error) {} }); }
      function mountScene(routeId, pushHistory) {
        var scene = scenes[routeId];
        if (!scene) return;
        if (pushHistory) historyStack.push(root.dataset.activeRoute || 'workspace-order-create');
        destroyScene();
        root.dataset.activeRoute = routeId;
        root.innerHTML = scene.template;
        scene.init({
          root: root,
          navigate: function (nextRoute) { mountScene(nextRoute, true); },
          back: back,
          toast: toast,
          dialog: function (options) { toast(options && options.message ? options.message : '操作已确认'); },
          onDestroy: function (callback) { destroyCallbacks.push(callback); }
        });
        root.querySelectorAll('[data-component-slug]').forEach(function (node) { node.dataset.component = node.dataset.componentSlug; });
      }
      function back() {
        if (historyStack.length) mountScene(historyStack.pop(), false);
        else location.href = '../../../workspace/v1.0.0/pages/workspace.html';
      }

      window.WegoApp = { registerScene: function (scene) { scenes[scene.routeId] = scene; } };
      window.__mountSalesOrder = function () { mountScene('workspace-order-create', false); };
    })();
  </script>
  <script src="../source/scene.js?v=catalog-hidden-review43"></script>
  <script>window.__mountSalesOrder();</script>
</body>
</html>
